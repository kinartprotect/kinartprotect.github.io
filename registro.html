<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - KinArtProtect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 400px;">
    <div class="badge">✦ KINARTPROTECT</div>
    <h1>Registro de Artista</h1>
    <p class="subtitle">Crea tu cuenta para certificar obras</p>
    
    <form id="registroForm" onsubmit="registrarUsuario(event)">
        <!-- NUEVO CAMPO: Nombre del Artista -->
        <div class="form-group">
            <label>🎨 Nombre del Artista</label>
            <input type="text" id="regNombreArtista" placeholder="Ej: María González" required>
            <small style="color: #7a5a4a; font-size: 11px;">Este nombre aparecerá en tus certificaciones</small>
        </div>
        
        <div class="form-group">
            <label>📧 Correo Electrónico</label>
            <input type="email" id="regEmail" placeholder="artista@email.com" required>
        </div>
        
        <div class="form-group">
            <label>🔑 Contraseña</label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        
        <div class="form-group">
            <label>🔐 Confirmar Contraseña</label>
            <input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required>
        </div>
        
        <div class="form-group">
            <label>📋 Código de Confirmación</label>
            <input type="text" id="regCodigo" placeholder="Ej: KIN-2024-001" required>
            <small style="color: #7a5a4a; font-size: 11px;">Contacta a soporte para obtener tu código</small>
        </div>
        
        <button type="submit" class="btn-generate">📝 Registrarse</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <p style="font-size: 12px; color: #7a5a4a;">
            ¿Ya tienes cuenta? <a href="login.html" style="color: #2c1810; font-weight: bold;">Inicia sesión</a>
        </p>
    </div>
    
    <div id="registroMessage" style="margin-top: 15px; text-align: center;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
