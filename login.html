<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KinArtProtect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 400px;">
    <div class="badge">✦ KINARTPROTECT</div>
    <h1>Acceso al Sistema</h1>
    <p class="subtitle">Ingresa tus credenciales para generar QR</p>
    
    <form id="loginForm" onsubmit="login(event)">
        <div class="form-group">
            <label>📧 Correo Electrónico</label>
            <input type="email" id="loginEmail" placeholder="artista@email.com" required>
        </div>
        
        <div class="form-group">
            <label>🔑 Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn-generate">🔐 Iniciar Sesión</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <p style="font-size: 12px; color: #7a5a4a;">
            ¿No tienes cuenta? <a href="registro.html" style="color: #2c1810; font-weight: bold;">Regístrate aquí</a>
        </p>
    </div>
    
    <div id="loginMessage" style="margin-top: 15px; text-align: center;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
